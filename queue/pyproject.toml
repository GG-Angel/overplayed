[project]
name = "queue"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "cryptography>=49.0.0",
    "fastapi[standard]>=0.136.3",
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.2",
    "redis[hiredis]>=8.0.0",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "fakeredis>=2.37.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ty>=0.0.65",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["app"]

[tool.ty.environment]
root = ["./app"]
