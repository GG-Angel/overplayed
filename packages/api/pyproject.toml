[project]
name = "api"
version = "1.0.0"
description = "API service for Overplayed"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "asyncpg-stubs>=0.31.2",
    "cryptography>=50.0.0",
    "fastapi[standard]>=0.140.7",
    "loguru>=0.7.3",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.2",
    "redis[hiredis]>=8.1.0",
    "shared",
    "slowapi>=0.1.9",
    "spotipy>=2.26.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.3.0", "ruff>=0.16.0", "ty>=0.0.65"]

[tool.uv.sources]
shared = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
venvPath = "../../"
venv = ".venv"
strict = ["**/*.py"]
pythonVersion = "3.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
