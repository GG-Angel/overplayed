global:
  scrape_interval: 10s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "overplayed-prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "overplayed-api"
    static_configs:
      - targets: ["api:9090"]

  - job_name: "overplayed-queue"
    static_configs:
      - targets: ["queue:9090"]
