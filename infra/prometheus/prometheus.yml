global:
  scrape_interval: 15s
  evaluation_interval: 20s

scrape_configs:
  - job_name: "overplayed-prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "overplayed-server"
    static_configs:
      - targets: ["server:8080"]

  - job_name: "overplayed-queue"
    static_configs:
      - targets: ["queue:8080"]
