services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    container_name: overplayed-caddy
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/ssl/certs/certificate.pem:/etc/ssl/certs/certificate.pem:ro
      - /etc/ssl/private/key.pem:/etc/ssl/private/key.pem:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
  server:
    build:
      context: server
      dockerfile: Dockerfile
    env_file: server/.env
    restart: unless-stopped
    container_name: overplayed-server
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      - db
      - redis
      # - queue
  # queue:
  #   build:
  #     context: queue
  #     dockerfile: Dockerfile
  #   env_file: queue/.env
  #   restart: unless-stopped
  #   container_name: overplayed-queue
  #   depends_on:
  #     - redis
  redis:
    image: redis:8.8.0-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    container_name: overplayed-redis
    volumes:
      - redis-data:/data
  db:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    container_name: overplayed-db
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  redis-data:
  postgres-data:
  caddy-data:
  caddy-config:
