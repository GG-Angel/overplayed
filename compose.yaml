services:
  caddy:
    image: caddy:2.11.4-alpine
    container_name: overplayed-caddy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/ssl/certs/certificate.pem:/etc/ssl/certs/certificate.pem:ro
      - /etc/ssl/private/key.pem:/etc/ssl/private/key.pem:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
      - queue
    networks:
      - proxy
    profiles:
      - prod

  server:
    image: GG-Angel/overplayed-server:latest
    platform: linux/amd64
    container_name: overplayed-server
    env_file: server/.env
    restart: unless-stopped
    depends_on:
      - redis
      - db
    networks:
      - proxy
      - internal

  queue:
    image: GG-Angel/overplayed-queue:latest
    platform: linux/amd64
    env_file: queue/.env
    restart: unless-stopped
    container_name: overplayed-queue
    depends_on:
      - redis
    networks:
      - proxy
      - internal

  grafana:
    image: grafana/grafana
    container_name: overplayed-grafana
    restart: unless-stopped
    environment:
      - GF_SERVER_ROOT_URL=https://grafana-overplayed.gaelangel.com
      - GF_SECURITY_ADMIN_USER
      - GF_SECURITY_ADMIN_PASSWORD
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - proxy
      - internal

  prometheus:
    image: prom/prometheus
    container_name: overplayed-prometheus
    restart: unless-stopped
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus:/etc/prometheus/
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - internal

  redis:
    image: redis:8.8.1-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    container_name: overplayed-redis
    volumes:
      - redis-data:/data
    networks:
      - internal

  db:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    container_name: overplayed-db
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - internal

volumes:
  redis-data:
  postgres-data:
  grafana-data:
  prometheus-data:
  caddy-data:
  caddy-config:

networks:
  proxy:
  internal:
    internal: true
