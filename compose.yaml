services:
  server:
    image: ghcr.io/gg-angel/overplayed-server:latest
    platform: linux/amd64
    container_name: overplayed-server
    env_file: server/.env
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      - redis
      - db
    networks:
      - external
      - internal

  queue:
    image: ghcr.io/gg-angel/overplayed-queue:latest
    platform: linux/amd64
    container_name: overplayed-queue
    env_file: queue/.env
    restart: unless-stopped
    ports:
      - 127.0.0.1:8081:8080
    depends_on:
      - redis
    networks:
      - external
      - internal

  grafana:
    image: grafana/grafana:13.1.4
    container_name: overplayed-grafana
    restart: unless-stopped
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.gaelangel.com
      - GF_SECURITY_ADMIN_USER
      - GF_SECURITY_ADMIN_PASSWORD
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - external
      - internal

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: overplayed-prometheus
    restart: unless-stopped
    volumes:
      - prometheus-data:/prometheus
      - ./infra/prometheus:/etc/prometheus/
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - internal

  redis:
    image: redis:8.10.0-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    container_name: overplayed-redis
    volumes:
      - redis-data:/data
    networks:
      - internal

  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    container_name: overplayed-db
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - internal

volumes:
  redis-data:
  postgres-data:
  grafana-data:
  prometheus-data:
  caddy-data:
  caddy-config:

networks:
  external:
  internal:
    internal: true
