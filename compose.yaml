services:
  overplayed-redis:
    image: redis:alpine
    restart: unless-stopped
    container_name: overplayed-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
  overplayed-db:
    image: postgres:alpine
    restart: unless-stopped
    container_name: overplayed-db
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres-data:/var/lib/postgresql
  overplayed-server:
    build:
      context: server
      dockerfile: Dockerfile
    env_file: server/.env
    restart: unless-stopped
    container_name: overplayed-server
    ports:
      - 8080:8080
    depends_on:
      - overplayed-redis
      - overplayed-db

volumes:
  redis-data:
  postgres-data:
