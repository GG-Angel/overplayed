services:
  server:
    build:
      context: server
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    environment:
      - DEBUG
      - SPOTIFY_CLIENT_ID
      - SPOTIFY_CLIENT_SECRET
      - REDIS_PASSWORD
      - REDIS_KEY
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: server
          target: /app
          ignore:
            - pyproject.toml
            - uv.lock
        - action: rebuild
          path: server/pyproject.toml
        - action: rebuild
          path: server/uv.lock
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    ports:
      - 127.0.0.1:6379:6379
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:alpine
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - 127.0.0.1:5432:5432
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
