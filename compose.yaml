services:
  server:
    image: ghcr.io/gg-angel/overplayed-server:latest
    platform: linux/amd64
    container_name: overplayed-server
    env_file: .env
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      - redis
      - postgres
    networks:
      - external
      - internal

  queue:
    image: ghcr.io/gg-angel/overplayed-queue:latest
    platform: linux/amd64
    container_name: overplayed-queue
    env_file: .env
    restart: unless-stopped
    ports:
      - 127.0.0.1:8081:8080
    depends_on:
      - redis
    networks:
      - external
      - internal

  grafana:
    image: grafana/grafana:13.1.3
    container_name: overplayed-grafana
    restart: unless-stopped
    env_file: .env
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - external
      - internal

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: overplayed-prometheus
    restart: unless-stopped
    volumes:
      - prometheus-data:/prometheus
      - ./infra/prometheus:/etc/prometheus/
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - internal

  redis:
    image: redis:8.8.1-alpine
    container_name: overplayed-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    env_file: .env
    volumes:
      - redis-data:/data
    networks:
      - internal

  postgres:
    image: postgres:18.4-alpine3.24
    container_name: overplayed-postgres
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - internal

networks:
  external:
  internal:
    internal: true

volumes:
  redis-data:
  postgres-data:
  grafana-data:
  prometheus-data:
  caddy-data:
  caddy-config:
