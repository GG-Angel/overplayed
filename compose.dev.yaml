services:
  server:
    build:
      context: server
      dockerfile: Dockerfile
    env_file: server/.env
    container_name: overplayed-server
    ports:
      - 8080:8080
    depends_on:
      - db
      - redis
      - queue
  queue:
    build:
      context: queue
      dockerfile: Dockerfile
    env_file: queue/.env
    container_name: overplayed-queue
    ports:
      - 8000:8000
    depends_on:
      - redis
  redis:
    image: redis:8.8.0-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    container_name: overplayed-redis
    volumes:
      - redis-data:/data
  db:
    image: postgres:18.4-alpine3.24
    container_name: overplayed-db
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  redis-data:
  postgres-data:
  caddy-data:
  caddy-config:
