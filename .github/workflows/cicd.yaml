name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  TAILSCALE_HOST: vps

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: api
          - context: queue
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Lowercase Repository Name
        id: lc
        run: |
          echo "repo=${REPO,,}" >>${GITHUB_OUTPUT}
        env:
          REPO: "${{ github.repository }}"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.context }}/Dockerfile
          tags: ${{ env.REGISTRY }}/${{ steps.lc.outputs.repo }}-${{ matrix.context }}:latest
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.lc.outputs.repo }}-${{ matrix.context }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.lc.outputs.repo }}-${{ matrix.context }}:buildcache,mode=max

  deploy:
    name: Deploy on Server
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    steps:
      - name: Connect to Tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_FI_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Resolve Tailscale IP
        id: ts
        run: echo "ip=$(tailscale ip -4 "$TAILSCALE_HOST")" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ steps.ts.outputs.ip }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}
          script: |
            set -e
            cd ~/${{ github.event.repository.name }}
            git pull
            docker compose -f compose.yaml pull
            docker compose -f compose.yaml run --rm api .venv/bin/alembic upgrade head
            docker compose -f compose.yaml up -d --remove-orphans
