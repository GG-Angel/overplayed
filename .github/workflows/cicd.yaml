name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  TAILSCALE_HOST: vps

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: server
          - context: queue
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Lowercase Repository Name
        id: lc
        run: |
          echo "repo=${REPO,,}" >>${GITHUB_OUTPUT}
        env:
          REPO: "${{ github.repository }}"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ matrix.context }}
          tags: ${{ env.REGISTRY }}/${{ steps.lc.outputs.repo }}-${{ matrix.context }}:latest
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.lc.outputs.repo }}-${{ matrix.context }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.lc.outputs.repo }}-${{ matrix.context }}:buildcache,mode=max

  deploy:
    name: Deploy on Server
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    steps:
      - name: Connect to Tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_FI_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Resolve Tailscale IP
        id: ts
        run: echo "ip=$(tailscale ip -4 "$TAILSCALE_HOST")" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ steps.ts.outputs.ip }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}
          script: |
            set -e
            cd ~/${{ github.event.repository.name }}
            git pull
            docker compose -f compose.yaml pull
            docker compose -f compose.yaml run --rm server .venv/bin/alembic upgrade head
            docker compose -f compose.yaml up -d --remove-orphans
