services:
  server:
    build:
      context: ./server
    ports:
      - 127.0.0.1:8080:8080

  queue:
    build:
      context: ./queue
    ports:
      - 127.0.0.1:8081:8080

  grafana:
    ports:
      - 127.0.0.1:3000:3000
    environment:
      - GF_SERVER_ROOT_URL=http://localhost:3000

  prometheus:
    ports:
      - 127.0.0.1:9090:9090

  db:
    ports:
      - 127.0.0.1:5432:5432

  redis:
    ports:
      - 127.0.0.1:6379:6379
