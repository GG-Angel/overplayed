services:
  server:
    build:
      context: ./server
    environment:
      - APP_DEBUG=true
      - APP_FRONTEND_URL=http://127.0.0.1:5173
      - APP_API_URL=http://127.0.0.1:8080

  queue:
    build:
      context: ./queue
    environment:
      - APP_DEBUG=true
      - APP_FRONTEND_URL=http://127.0.0.1:5173
      - APP_API_URL=http://127.0.0.1:8080

  grafana:
    environment:
      - GF_SERVER_ROOT_URL=http://localhost:3000

  prometheus:
    ports:
      - 127.0.0.1:9090:9090
    networks:
      - external

  postgres:
    ports:
      - 127.0.0.1:5432:5432
    networks:
      - external

  redis:
    ports:
      - 127.0.0.1:6379:6379
    networks:
      - external
