[project]
name = "server"
version = "1.0.0"
description = "Overplayed API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "asyncpg-stubs>=0.31.2",
    "cryptography>=50.0.0",
    "fastapi[standard]>=0.140.7",
    "loguru>=0.7.3",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.2",
    "redis[hiredis]>=8.1.0",
    "slowapi>=0.1.9",
    "spotipy>=2.26.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.0",
    "ty>=0.0.65",
]

[tool.ruff.lint]
ignore = ["BLE001"] # catch on exception

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
