[project]
name = "server"
version = "0.1.0"
description = "Overplayed API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "asyncpg-stubs>=0.31.3",
    "cryptography>=48.0.1",
    "fastapi[standard]>=0.140.7",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "redis[hiredis]>=8.0.1",
    "slowapi>=0.1.10",
    "spotipy>=2.26.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.16.1", "ty>=0.0.65"]

[tool.ruff.lint]
ignore = ["BLE001"] # catch on exception

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
