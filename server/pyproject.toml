[project]
name = "server"
version = "0.1.0"
description = "Overplayed API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "asyncpg-stubs>=0.31.2",
    "cryptography>=48.0.0",
    "fastapi[standard]>=0.136.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "redis[hiredis]>=5.0.0",
    "slowapi>=0.1.9",
    "spotipy>=2.26.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "uvicorn>=0.46.0",
]

[tool.pytest.ini_options]
pythonpath = "src"


[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.3.0"]
