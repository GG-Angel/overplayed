[project]
name = "api"
version = "1.0.0"
description = "API service for Overplayed"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.4",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "asyncpg-stubs>=0.31.3",
    "cryptography>=50.0.1",
    "fastapi[standard]>=0.140.7",
    "loguru>=0.7.3",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "redis[hiredis]>=8.1.0",
    "slowapi>=0.1.10",
    "shared",
    "spotipy>=2.26.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.uv.sources]
shared = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
venvPath = "../../"
venv = ".venv"
strict = ["**/*.py"]
pythonVersion = "3.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
